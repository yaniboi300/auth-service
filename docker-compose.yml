services:
  auth_db:
    image: postgres:16-alpine
    container_name: auth-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_db
    ports:
      - "5435:5432" # Порт 5435, чтобы не конфликтовать с CRM (5433) и Notification (5434)
    volumes:
      - auth_pgdata:/var/lib/postgresql/data
    networks:
      - microservices-net

  auth-app:
    build: .
    container_name: auth-app
    env_file:
      - .env
    depends_on:
      - auth_db
      - kafka
    ports:
      - "8002:8000" # Порт 8002 для Auth-сервиса
    volumes:
      - .:/app
    networks:
      - microservices-net

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - microservices-net

  kafka:
    image: confluentinc/cp-kafka:7.3.1
    depends_on:
      - zookeeper
    ports:
      - "9093:9092" # <--- Обрати внимание! 9093, чтобы не конфликтовать с Kafka из profile-service
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  microservices-net:
    external: true

volumes:
  auth_pgdata: